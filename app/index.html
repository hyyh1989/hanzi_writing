<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>练习本</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="练习本">
<meta name="theme-color" content="#FAFAF7">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@700&family=Baloo+2:wght@500;700&family=Nunito:wght@400;600;800&display=swap">
<style>
:root{
  --paper:#FAFAF7; --card:#FFFFFF; --sunk:#F1F2EE;
  --ink:#1B2530; --ink-2:#4B5761; --ink-3:#7C8891;
  --line:#E0E2DB; --line-2:#EDEEE8;
  --zhu:#CE3E33; --zhu-soft:rgba(206,62,51,.32); --zhu-bg:#FBEDEB;
  --teal:#12796F; --teal-2:#0D5F57; --teal-soft:#E2F0EE;
  --amber:#D98C1F; --amber-soft:#FAEDD6;
  --good:#2F8F4E; --bad:#C4453A;
  --trace:#EBD2CE;
  --shadow:0 1px 2px rgba(27,37,48,.05),0 10px 24px -14px rgba(27,37,48,.22);
  --r:14px;
  --disp:"Baloo 2","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --body:"Nunito","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --han:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  /* Monster Phonics 的颜色（英文单词用，照学校词表） */
  --mp-red:#FF3B30; --mp-green:#22C55E; --mp-yellow:#F7BE00; --mp-pink:#FF5CC8;
  --mp-blue:#1EA7FF; --mp-brown:#B8703F; --mp-gold:#FF9500; --mp-silent:#C9D1D8; --mp-purple:#B455E8;
  --mp-yellow-t:#D9A400;  /* 黄色当文字（组名）用时深一点，不然白底上看不清 */
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#141A1E; --card:#1C2328; --sunk:#232B31;
  --ink:#EAEEF0; --ink-2:#AFB9C0; --ink-3:#828E96;
  --line:#323C43; --line-2:#272F35;
  --zhu:#E8695C; --zhu-soft:rgba(232,105,92,.36); --zhu-bg:#2A1D1C;
  --teal:#4FC3B3; --teal-2:#6FD3C4; --teal-soft:#14312D;
  --amber:#E8AC4B; --amber-soft:#2E2617;
  --good:#5BC07C; --bad:#E8756A;
  --trace:#4A3B39;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 24px -14px rgba(0,0,0,.6);
  --mp-red:#FF5A50; --mp-green:#3DDC75; --mp-yellow:#FFD426; --mp-pink:#FF74D4; --mp-blue:#4DBBFF; --mp-brown:#D08A57; --mp-gold:#FFA630; --mp-silent:#4E5961; --mp-purple:#C98AF5; --mp-yellow-t:#FFD426;
}}
:root[data-theme="dark"]{
  --paper:#141A1E; --card:#1C2328; --sunk:#232B31;
  --ink:#EAEEF0; --ink-2:#AFB9C0; --ink-3:#828E96;
  --line:#323C43; --line-2:#272F35;
  --zhu:#E8695C; --zhu-soft:rgba(232,105,92,.36); --zhu-bg:#2A1D1C;
  --teal:#4FC3B3; --teal-2:#6FD3C4; --teal-soft:#14312D;
  --amber:#E8AC4B; --amber-soft:#2E2617;
  --good:#5BC07C; --bad:#E8756A;
  --trace:#4A3B39;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 24px -14px rgba(0,0,0,.6);
  --mp-red:#FF5A50; --mp-green:#3DDC75; --mp-yellow:#FFD426; --mp-pink:#FF74D4; --mp-blue:#4DBBFF; --mp-brown:#D08A57; --mp-gold:#FFA630; --mp-silent:#4E5961; --mp-purple:#C98AF5; --mp-yellow-t:#FFD426;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
body{background:var(--paper);color:var(--ink);font-family:var(--body);
     -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.app{max-width:940px;margin:0 auto;padding-inline:16px;padding-block:0 40px}
h1,h2,h3{margin:0;text-wrap:balance;font-family:var(--disp);font-weight:700;letter-spacing:.01em}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0;margin:0}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px;border-radius:6px}

/* ── 顶栏 ── */
.top{position:sticky;top:0;z-index:20;background:var(--paper);
     border-bottom:1px solid var(--line-2);margin-inline:-16px;
     padding:10px 16px;display:flex;align-items:center;gap:10px}
.top h1{font-size:19px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;
         justify-content:center;text-align:center;font-size:18px;color:var(--ink-2);flex:none}
.iconbtn:hover{background:var(--sunk)}
/* 「要多练」标记按钮。用青色不用朱红——朱红在这个 app 里=错，而"要多练"不是错，别让孩子看见红色就紧张。 */
.markbtn{flex:none;font-size:12.5px;font-weight:800;padding:0 11px;min-height:40px;
         border-radius:11px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.markbtn.on{background:var(--teal);color:#fff}
.starcount{font-family:var(--disp);font-weight:700;font-size:15px;color:var(--amber);
           background:var(--amber-soft);padding:5px 11px;border-radius:999px;white-space:nowrap;
           font-variant-numeric:tabular-nums}

/* ── 首页 ── */
/* 面包屑。每一格都是能点的大按钮；第一格是小房子 + 「首页」——她认字不多，看小房子就知道是回家。
   按钮本身不用 flex（iPad Safari 上 <button> 当 flex 容器内容会偏），图标靠 vertical-align 对齐 */
.crumbs{flex:1;min-width:0;display:flex;align-items:center;gap:6px;overflow:hidden}
.crumbs #crumbs-pre{display:contents}
.crumb{flex:none;display:inline-block;padding:8px 12px;border-radius:10px;background:var(--sunk);
       font-weight:800;font-size:14.5px;color:var(--ink-2);white-space:nowrap;line-height:1.2}
.crumb svg{width:17px;height:17px;vertical-align:-3px;margin-right:5px}
.crumbs .sep{flex:none;color:var(--ink-3);font-style:normal;font-weight:700}
.crumbs h1{flex:1;min-width:0}
.chip.latin .g{font-family:"Andika","Comic Neue",system-ui,sans-serif;font-weight:700}
.soon{background:var(--card);border:1px dashed var(--line);border-radius:var(--r);padding:26px 18px;
      text-align:center;color:var(--ink-3);margin-top:16px}
.tabs{display:flex;gap:6px;background:var(--sunk);padding:4px;border-radius:12px;margin:18px 0 16px}
.tabs button{flex:1;padding:9px 4px;border-radius:9px;font-weight:700;font-size:14px;color:var(--ink-3)}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}

.lesson{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
        padding:14px 15px;margin-bottom:10px;box-shadow:var(--shadow)}
.lesson-h{display:flex;align-items:baseline;gap:9px;margin-bottom:3px}
.lesson-n{font-family:var(--disp);font-weight:700;font-size:13px;color:var(--zhu);
          background:var(--zhu-bg);border-radius:6px;padding:1px 7px;flex:none}
.lesson-h h3{font-size:16px}
.lesson-tip{font-size:13px;color:var(--ink-3);margin:0 0 11px;line-height:1.5}
.chips{display:flex;flex-wrap:wrap;gap:7px}
/* 居中交给里面的 span，不依赖 <button> 自己的 grid/flex 行为（Safari 上会偏） */
.chip{width:52px;height:52px;border-radius:11px;border:1px solid var(--line);
      background:var(--paper);position:relative;overflow:hidden;
      transition:transform .12s ease,border-color .12s ease}
.chip .g{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
         font-family:var(--han);font-size:26px;line-height:1;text-align:center}
.chip:hover{border-color:var(--teal);transform:translateY(-2px)}
.chip[data-done="1"]{border-color:var(--amber);background:var(--amber-soft)}
.chip .dot{position:absolute;right:3px;bottom:2px;font-size:9px;color:var(--amber);letter-spacing:-1px}

.theme-h{font-family:var(--disp);font-weight:700;font-size:14px;color:var(--ink-2);
         margin:16px 0 9px;display:flex;align-items:center;gap:9px}
.theme-h::after{content:"";flex:1;height:1px;background:var(--line-2)}
.lesson-k{font-size:11.5px;color:var(--teal);background:var(--teal-soft);padding:2px 9px;
          border-radius:999px;margin-left:auto;flex:none;font-weight:700;white-space:nowrap}
.chip.unknown{opacity:.38}
.lesson-tip .wz{font-family:var(--han);color:var(--zhu);font-weight:600;letter-spacing:.04em}
.ubox{width:26px;height:26px;border-radius:7px;border:2px solid var(--line);flex:none;
      display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;
      color:#fff;background:var(--paper);line-height:1}
.ubox.all{background:var(--teal);border-color:var(--teal)}
.ubox.some{background:var(--amber);border-color:var(--amber)}
/* 这张卡以前叫「错字库」用朱红，现在叫「要多练的字」——来源不只是写错，
   还有家长主动标的。改成青色：这不是一张"错题红榜"，别让她一打开就紧张。 */
.wrongbank{border-color:var(--teal);background:var(--teal-soft)}
.wrongbank h3{color:var(--teal-2)}
.wrongbank .lesson-k{color:var(--teal-2);background:var(--card)}
.wrongbank .chip{background:var(--card)}
.chip .dot.wn{font-size:10px;font-weight:800;color:var(--teal-2);letter-spacing:0;
              right:4px;bottom:2px}
.chip.pick.del{border-color:var(--bad)}
.chip.pick.del .dot.wn{color:var(--bad)}
.chip.pick .g{color:var(--ink-3)}
.chip.pick.on{border-color:var(--teal);background:var(--teal-soft);border-width:2px}
.chip.pick.on .g{color:var(--ink)}
.selbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);
        border-top:1px solid var(--line);box-shadow:0 -6px 20px -12px rgba(0,0,0,.3)}
.selbar-in{max-width:940px;margin:0 auto;padding:11px 16px;display:flex;align-items:center;
           justify-content:space-between;gap:12px;font-size:14px;color:var(--ink-2)}
.selbar-in b{font-family:var(--disp);font-size:19px;color:var(--teal);
             font-variant-numeric:tabular-nums}
.selbar-in .btn{min-height:46px;padding:11px 16px;font-size:14px}
.selbar-btns{display:flex;gap:8px;flex:none}
body.has-bar .app{padding-bottom:100px}
.pt{font-size:15px;margin-bottom:7px}
.note{font-size:12.5px;color:var(--ink-3);line-height:1.55;margin:0 0 10px}
.count{font-size:13px;color:var(--ink-3);align-self:center}
.dict-h{display:flex;align-items:center;justify-content:space-between;gap:10px;
        margin:16px 0 10px;font-size:13.5px;color:var(--ink-2);font-weight:800}
.dict-h b{color:var(--teal);font-size:16px}
.dict-py{font-family:var(--han);font-size:30px;font-weight:600;color:var(--teal);
         text-align:center;margin-bottom:12px;letter-spacing:.02em}
.dcatch{position:absolute;inset:0;z-index:5;cursor:crosshair}
.jrow{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
      padding:13px;margin-bottom:10px;box-shadow:var(--shadow);display:flex;gap:13px;
      align-items:flex-start;flex-wrap:wrap}
.jpair{display:flex;gap:7px;flex:none}
.jc{width:72px;text-align:center}
.jc svg{width:72px;height:72px;display:block;background:var(--paper);
        border:1px solid var(--line-2);border-radius:6px}
.jc span{display:block;font-size:10.5px;color:var(--ink-3);margin-top:3px}
.jinfo{flex:1;min-width:150px}
.jch{font-family:var(--han);font-size:26px;font-weight:600;line-height:1.1}
.jch small{font-size:14px;color:var(--teal);font-weight:600}
.jbtns{display:flex;gap:7px;margin-top:9px}
.jb{font-size:13px;font-weight:800;padding:9px 13px;border-radius:9px;min-height:40px;
    border:1.5px solid var(--line);color:var(--ink-3)}
.jb.on.ok{background:var(--teal);border-color:var(--teal);color:#fff}
.jb.on.no{background:var(--bad);border-color:var(--bad);color:#fff}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;
       background:var(--ink);color:var(--paper);font-size:13.5px;font-weight:700;
       padding:10px 18px;border-radius:999px;box-shadow:var(--shadow)}
.linkbtn{font-size:12.5px;font-weight:700;color:var(--teal);background:var(--teal-soft);
         padding:3px 10px;border-radius:7px}
.sel{font:inherit;font-size:13.5px;padding:7px 9px;border-radius:9px;border:1px solid var(--line);
     background:var(--paper);color:var(--ink);max-width:100%}
.vrow{display:flex;gap:8px;align-items:center;flex:1;min-width:0;justify-content:flex-end}
.vrow .sel{flex:1;min-width:0}
.vrow .linkbtn{flex:none}
.lrow{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
.lrow .linkbtn{padding:7px 12px;font-size:13px}
.eg{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;line-height:1.7;
    background:var(--sunk);border-radius:8px;padding:9px 11px;margin:0 0 10px;overflow-x:auto;
    color:var(--ink-2);white-space:pre}
.upv{display:flex;gap:10px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line-2);
     font-size:13px}
.upv b{flex:none;color:var(--ink-2);font-size:12.5px;min-width:96px}
.upv span{font-family:var(--han);font-size:17px;flex:1;word-break:break-all;line-height:1.5}
.upv i{flex:none;font-style:normal;color:var(--ink-3);font-size:11.5px}
textarea.code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;
              line-height:1.45;word-break:break-all}
.ok{color:var(--good)} .bad{color:var(--bad)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;
       box-shadow:var(--shadow)}
.panel p{margin:0 0 11px;font-size:13.5px;color:var(--ink-3);line-height:1.6}
textarea,input[type=text]{width:100%;font-family:var(--han);font-size:19px;padding:11px 12px;
  border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--teal);
     color:#fff;font-weight:800;font-size:15px;padding:13px 20px;border-radius:11px;min-height:50px}
.btn:hover{background:var(--teal-2)}
.btn.ghost{background:transparent;color:var(--teal);border:1.5px solid var(--teal)}
.btn.ghost:hover{background:var(--teal-soft)}
.btn.quiet{background:var(--sunk);color:var(--ink-2)}
.btn.quiet:hover{background:var(--line-2)}
.btn[disabled]{opacity:.4;pointer-events:none}
.row{display:flex;gap:9px;flex-wrap:wrap}
.miss{color:var(--bad);font-size:13px;margin-top:9px}

/* ── 练习页 ── */
.pr-head{display:flex;align-items:center;gap:12px;margin:16px 0 12px}
.pr-char{font-family:var(--han);font-size:34px;line-height:1;font-weight:600}
.pr-char.latin{font-family:"Andika","Comic Neue",system-ui,sans-serif;font-weight:700}
.pr-meta{flex:1;min-width:0}
.pr-py{font-family:var(--han);font-size:17px;color:var(--teal);font-weight:600}
.pr-sub{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}

.rowstrip{margin:0 0 13px}
.rc-h{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:12.5px;
      color:var(--ink-3);font-weight:800;flex-wrap:wrap}
.rc-h button{font-size:12px;font-weight:700;color:var(--teal);background:var(--teal-soft);
             padding:5px 11px;border-radius:8px}
.rc-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:5px;-webkit-overflow-scrolling:touch}
.rc{flex:none;width:56px;text-align:center}
.rc svg{width:56px;height:56px;display:block;background:var(--card);
        border:1px solid var(--line-2);border-radius:6px}
.rc.now svg{border-color:var(--teal);border-width:2px}
.rc.model{margin-right:11px;position:relative}
.rc.model::after{content:"";position:absolute;right:-6px;top:3px;bottom:17px;
                 border-right:1px dashed var(--line)}
.rc span{display:block;font-size:10.5px;color:var(--amber);margin-top:3px;height:14px;
         letter-spacing:-.5px;white-space:nowrap}
.rc.now span{color:var(--teal);font-weight:800}
.rc.model span{color:var(--ink-3);font-weight:700}
.stage{display:grid;place-items:center;margin-bottom:14px;position:relative}
/* 猫是绝对定位的：米字格必须保持居中，不能被它挤偏。位置由 placePet() 算。 */
#petbox{position:absolute;bottom:0;pointer-events:none;z-index:1}
#petbox.inhead{position:static;pointer-events:none;flex:none;margin-left:auto}
.gridwrap{position:relative;background:var(--card);border-radius:6px;touch-action:none}
.gridwrap svg.deco{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.mzg rect{fill:none;stroke:var(--zhu);stroke-width:6}
.flg rect{fill:none;stroke:var(--line);stroke-width:6}
.flg line{stroke:var(--zhu-soft);stroke-width:4}
.flg .fm{stroke-dasharray:24 18}
.flg .fb{stroke:var(--zhu);stroke-width:6}
.mzg line{stroke:var(--zhu-soft);stroke-width:4;stroke-dasharray:24 18}
#writer{position:relative;z-index:2}
.ovl{z-index:3}

.hintbar{text-align:center;font-size:14px;color:var(--ink-2);min-height:22px;margin-bottom:12px;
         line-height:1.5;padding-inline:8px}
.hintbar b{color:var(--zhu)}
.controls{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-bottom:18px}

.strip-h{font-size:12px;font-weight:800;color:var(--ink-3);letter-spacing:.08em;margin:0 0 7px}
.strip-h small{font-weight:600;letter-spacing:0;opacity:.75}
.strip{display:flex;gap:6px;overflow-x:auto;padding-bottom:5px;margin-bottom:13px;
       -webkit-overflow-scrolling:touch}
.strip-cell{flex:none;width:46px}
.strip-cell svg{width:46px;height:46px;display:block;background:var(--card);
                border:1px solid var(--line-2);border-radius:5px}
.strip-cell span{display:block;text-align:center;font-family:var(--disp);font-size:11px;
                 color:var(--ink-3);margin-top:2px;font-variant-numeric:tabular-nums}

/* ── 评分 ── */
.score{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;
       box-shadow:var(--shadow);margin-bottom:14px}
.score-top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.score-stars{font-size:28px;letter-spacing:2px;line-height:1}
.score-top h3{font-size:17px}
.metric{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:11px;
        padding:9px 0;border-top:1px solid var(--line-2)}
.metric-k{font-size:13px;font-weight:800;color:var(--ink-2)}
.metric-v{font-size:13.5px;color:var(--ink-2);line-height:1.45}
.metric-s{font-size:14px;letter-spacing:1px;white-space:nowrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--ink-3);
        margin-bottom:12px;justify-content:center}
.legend i{display:inline-block;width:14px;height:0;border-top-width:2px;vertical-align:middle;
          margin-right:5px}
.lg-t{border-top:2px dashed var(--teal)}
.lg-u{border-top:2px solid var(--amber)}

/* ── 设置 ── */
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);
       padding:20px;max-width:340px;width:calc(100vw - 32px);box-shadow:0 24px 60px -20px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(20,26,30,.45)}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;
        border-bottom:1px solid var(--line-2);font-size:14.5px}
.setrow:last-of-type{border-bottom:0}
.sw{width:52px;height:31px;border-radius:999px;background:var(--line);position:relative;flex:none;
    transition:background .16s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;
           background:#fff;transition:transform .16s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw[aria-pressed="true"]{background:var(--teal)}

let ac=null;
function beep(type){
  if(!cfg.sound) return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==="suspended") ac.resume();
    const seq = type==="good"?[[660,0],[880,.09],[1175,.18]] : type==="bad"?[[300,0],[240,.1]] : [[880,0]];
    seq.forEach(([f,t])=>{
      const o=ac.createOscillator(), g=ac.createGain();
      o.type="sine"; o.frequency.value=f;
      g.gain.setValueAtTime(.0001,ac.currentTime+t);
      g.gain.exponentialRampToValueAtTime(.13,ac.currentTime+t+.015);
      g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+t+.16);
      o.connect(g); g.connect(ac.destination); o.start(ac.currentTime+t); o.stop(ac.currentTime+t+.18);
    });
  }catch(e){}
}

function utterEn(txt,base){
  const u=new SpeechSynthesisUtterance(txt);
  u.lang="en-GB"; u.pitch=1; u.rate=(base||.8)*(cfg.rate||1);
  try{

    if(v){ u.voice=v; u.lang=v.lang; }

}

/* ── 米字格方位（写字教学的说法）── */
function regionName(pt){
  const C=512, NEAR=112;
  const nx=Math.abs(pt.x-C)<NEAR, ny=Math.abs(pt.y-C)<NEAR;
  if(nx&&ny) return "正中间的中心点";
  if(nx) return pt.y<C ? "竖中线的上半段" : "竖中线的下半段";
  if(ny) return pt.x<C ? "横中线的左边" : "横中线的右边";
  return (pt.x<C?"左":"右")+(pt.y<C?"上":"下")+"格";
}
/* 四线格的说法（字母、数字）：顶线 / 中线 / 基线，再加靠左 / 靠右。
   坐标是 1024 方框的屏幕坐标；换回 latin_glyphs.py 的 100×130 坐标来判断 */
function latinRegion(pt){
  const S=1024/130, OX=(1024-100*S)/2, y=pt.y/S, x=(pt.x-OX)/S, NEAR=7;
  let v = Math.abs(y-15)<NEAR ? "顶线" : Math.abs(y-48)<NEAR ? "中线" : Math.abs(y-85)<NEAR ? "红色基线"
        : y<48 ? "顶线和中线之间" : y<85 ? "中线和基线之间" : "基线下面";
  /* 55 而不是更靠右：a/d/g/q 的圆从中线偏右起笔（x≈57），要念成「中线靠右」——
     孩子写反 a、d 最常见的就是从左边起笔、顺时针绕，这句话正好对着这个错 */
  const side = x<45 ? "靠左" : x>55 ? "靠右" : "";
  return side ? v+side+"的地方" : v;
}
function regionOf(pt){ return isLatin(cur) ? latinRegion(pt) : regionName(pt) }
function strokeStart(i){
  const d=glyph(cur); if(!d||!d.m[i]||!d.m[i].length) return null;
  const m=d.m[i];
  const a={x:m[0][0], y:900-m[0][1]};
  const j=Math.min(m.length-1, Math.max(1, Math.round(m.length*.3)));
  const b={x:m[j][0], y:900-m[j][1]};
  return {a,b};
}
function showStartDot(i,on){
  const el=$("#ovl"); if(!el) return;
  if(!on||i==null||i<0||!glyph(cur)||i>=glyph(cur).n){ el.innerHTML=""; return; }
  const s=strokeStart(i); if(!s){ el.innerHTML=""; return; }
  const dx=s.b.x-s.a.x, dy=s.b.y-s.a.y, L=Math.hypot(dx,dy)||1;
  const ux=dx/L, uy=dy/L, len=Math.min(140,L);
  const ex=s.a.x+ux*len, ey=s.a.y+uy*len, h=30;
  const tri=[[ex+ux*h,ey+uy*h],[ex-uy*h*.55,ey+ux*h*.55],[ex+uy*h*.55,ey-ux*h*.55]]
            .map(q=>q[0].toFixed(0)+","+q[1].toFixed(0)).join(" ");
  el.innerHTML=
    '<line x1="'+s.a.x+'" y1="'+s.a.y+'" x2="'+ex.toFixed(0)+'" y2="'+ey.toFixed(0)+
    '" stroke="var(--teal)" stroke-width="10" stroke-linecap="round" stroke-opacity=".5"/>'+
    '<polygon points="'+tri+'" fill="var(--teal)" fill-opacity=".5"/>'+
    '<circle class="startdot" cx="'+s.a.x+'" cy="'+s.a.y+'" r="34" fill="var(--zhu)"/>'+
    '<text x="'+s.a.x+'" y="'+(s.a.y+15)+'" text-anchor="middle" font-size="40" '+
    'font-weight="700" fill="#fff" font-family="sans-serif">'+(i+1)+'</text>';
}

const XF='scale(1,-1) translate(0,-900)';
function charSVG(ch,upto,opt){
  const d=glyph(ch); if(!d) return "";
  opt=opt||{};
  const n = upto==null ? d.s.length-1 : upto;
  let p="";
  for(let i=0;i<=n && i<d.s.length;i++){

         '<g transform="'+XF+'">'+p+'</g></svg>';

/* ── 今天的任务：自动出题 ──────────────────────────────────
   每个任务当天第一次显示时挑好内容，存进 mzg.days[今天].pick，【当天固定不变】——
   否则她写完一个字、星星一变，重算出来的就是另一批字了。「换一批」才会重挑。
   挑的顺序（用户定的「任务自动来」）：先「要多练的」，再按「还没练熟 → 最近没练」轮换 */
let fromTask=null;              /* 从哪个任务进来的（写完最后一个字时按钮变成「回到今天」） */
const TASK_N={"zh-write":3,"en-letters":4,"en-words":3,"math-digits":3,"zh-dict":8};
const TASK_SUBJ={"zh-write":"zh","zh-dict":"zh","en-letters":"en","en-words":"en","math-digits":"math"};
/* 任务里每一项在星星、练习记录里的键：单词加 w:，字和字母就是自己 */
function taskKey(id){ return id==="en-words" ? WK : function(c){ return c } }
function todayRec(){ const all=load(K.days,{}); return all[todayStr()]||{} }
function saveTodayRec(r){ const all=load(K.days,{}); all[todayStr()]=r; save(K.days,all) }
function practicedToday(c){ const r=load(K.plog,{})[c]; return !!(r&&r.t===todayStr()) }
/* 还没练熟的在前（星星少），同样的再按最近练过的日子，越久没练越靠前 */
function byNeed(list,key){
  const pl=load(K.plog,{}); key=key||function(c){ return c };
  return list.slice().sort(function(x,y){
    const a=key(x), b=key(y);
    const sa=Math.min(starsOf(a),3)>=3?1:0, sb=Math.min(starsOf(b),3)>=3?1:0;
    if(sa!==sb) return sa-sb;
    const ta=(pl[a]&&pl[a].t)||"", tb=(pl[b]&&pl[b].t)||"";
    return ta<tb?-1:ta>tb?1:0;
  });
}
function uniq(a){ return a.filter(function(c,i){ return a.indexOf(c)===i }) }
/* 同一天打乱的结果固定（听写用），换一天换顺序 */
function dayShuffle(a,salt){
  let h=0; const k=todayStr()+(salt||""); for(let i=0;i<k.length;i++) h=(h*31+k.charCodeAt(i))>>>0;
  const r=a.slice();
  for(let i=r.length-1;i>0;i--){ h=(h*1103515245+12345)>>>0; const j=h%(i+1); const t=r[i]; r[i]=r[j]; r[j]=t; }
  return r;
}
function taskCandidates(id){
  const upto=Math.min(cfg.lesson|0, TEXTBOOK.length-1);
  if(id==="zh-write"){
    /* 要多练的字 → 学过的课里「本册要求会写」的字（最近的课在前）→ 学过的其余字 */
    let w=[], rest=[];
    for(let i=upto;i>=0;i--){ const l=TEXTBOOK[i]; if(!l) continue;
      w=w.concat(l.write||[]); rest=rest.concat(l.chars.filter(c=>(l.write||[]).indexOf(c)<0)); }
    return uniq(wrongList().concat(byNeed(uniq(w)), byNeed(uniq(rest))));
  }
  if(id==="en-letters"){
    const mine=Object.keys(wrong).filter(c=>isLatin(c)&&!isDigit(c));
    return uniq(mine.concat(byNeed("bdpqszjNSZJ".split("")),
                byNeed("abcdefghijklmnopqrstuvwxyz".split("")), byNeed("ABCDEFGHIJKLMNOPQRSTUVWXYZ".split(""))));
  }
  if(id==="en-words"){
    /* 要多练的 → 两张表都有的 → 只在例外词表上的 → 只在高频词表上的；
       每组里短的先练（原样稳定排序），再按没练熟、越久没练的优先 */
    if(!window.EN_WORDS) return [];
    const E=EN_WORDS, both=E.CEW.filter(w=>E.HFW.indexOf(w)>=0);
    /* a、I 这种一个字母的词不进任务——拼写没什么可练的，写字母任务里已经有了 */
    const byLen=a=>a.filter(w=>w.length>1).sort((x,y)=>x.length-y.length);
    const mine=Object.keys(wrong).filter(k=>k.slice(0,2)==="w:").map(k=>k.slice(2)).filter(w=>E.W[w]);
    return uniq(mine.concat(byNeed(byLen(both),WK),
                byNeed(byLen(E.CEW.filter(w=>both.indexOf(w)<0)),WK),
                byNeed(byLen(E.HFW.filter(w=>both.indexOf(w)<0)),WK)));
  }
  if(id==="math-digits"){
    const mine=Object.keys(wrong).filter(c=>isDigit(c));
    return uniq(mine.concat(byNeed("23579".split("")), byNeed("0123456789".split(""))));
  }
  if(id==="zh-dict"){
    /* 这一周练过的字 + 要多练的字 + 当前这一课的字；打乱 */
    const pl=load(K.plog,{}), wk=new Date(); wk.setDate(wk.getDate()-7);
    const since=wk.getFullYear()+"-"+String(wk.getMonth()+1).padStart(2,"0")+"-"+String(wk.getDate()).padStart(2,"0");
    const week=Object.keys(pl).filter(c=>has(c)&&pl[c].t>=since);
    const cur=TEXTBOOK[upto]?TEXTBOOK[upto].chars:[];
    return dayShuffle(uniq(week.concat(wrongList(), cur)).filter(has));
  }
  return [];
}
function taskPick(id){
  const r=todayRec(); r.pick=r.pick||{};
  if(!r.pick[id]){ r.pick[id]=taskCandidates(id).slice(0,TASK_N[id]||3); saveTodayRec(r); }
  return r.pick[id];
}
/* 换一批：沿候选顺序往后轮（b d p q → s z j N → S Z J a → …，到头再从头来），
   不是「排除当前这批再挑」——那样只会在两批之间来回跳 */
function rerollTask(id){
  const r=todayRec(); r.pick=r.pick||{}; r.rr=r.rr||{};
  const list=taskCandidates(id), n=TASK_N[id]||3;
  if(!list.length) return;
  const k=(r.rr[id]||0)+1, start=(k*n)%list.length;
  r.rr[id]=k;
  r.pick[id]=uniq(list.slice(start).concat(list)).slice(0,Math.min(n,list.length));
  saveTodayRec(r);
}
const TASK_LABEL={"zh-write":"写 {n} 个字","en-letters":"写 {n} 个字母","en-words":"拼 {n} 个单词","math-digits":"写 {n} 个数字","zh-dict":"听写 {n} 个字"};
function taskInfo(id){
  const items=taskPick(id); if(!items.length) return {items:[]};
  const label=TASK_LABEL[id].replace("{n}",items.length);
  if(id==="zh-dict"){ const d=!!(todayRec().done||{})[id]; return {items,label,done:d?1:0,total:1,single:true}; }
  const key=taskKey(id), doneSet={}; items.forEach(function(c){ if(practicedToday(key(c))) doneSet[c]=1 });
  return {items, label, done:Object.keys(doneSet).length, total:items.length, doneSet};
}

  beep("tap");

  openChar(first,items);

function dotMarkup(i,on){
  if(!on||i==null||i<0||!glyph(cur)||i>=glyph(cur).n) return "";
  const s=strokeStart(i); if(!s) return "";
  const dx=s.b.x-s.a.x, dy=s.b.y-s.a.y, L=Math.hypot(dx,dy)||1;
  const ux=dx/L, uy=dy/L, len=Math.min(140,L);
  const ex=s.a.x+ux*len, ey=s.a.y+uy*len, h=30;
  const tri=[[ex+ux*h,ey+uy*h],[ex-uy*h*.55,ey+ux*h*.55],[ex+uy*h*.55,ey-ux*h*.55]]
            .map(q=>q[0].toFixed(0)+","+q[1].toFixed(0)).join(" ");
  return '<line x1="'+s.a.x+'" y1="'+s.a.y+'" x2="'+ex.toFixed(0)+'" y2="'+ey.toFixed(0)+
    '" stroke="var(--teal)" stroke-width="10" stroke-linecap="round" stroke-opacity=".5"/>'+
    '<polygon points="'+tri+'" fill="var(--teal)" fill-opacity=".5"/>'+
    '<circle class="startdot" cx="'+s.a.x+'" cy="'+s.a.y+'" r="34" fill="var(--zhu)"/>'+
    '<text x="'+s.a.x+'" y="'+(s.a.y+15)+'" text-anchor="middle" font-size="40" '+
    'font-weight="700" fill="#fff" font-family="sans-serif">'+(i+1)+'</text>';
}
function paintOverlay(dotIdx,dotOn){
  const el=$("#ovl"); if(!el) return;
  el.innerHTML = inkPaths(ink,"var(--ink)") + dotMarkup(dotIdx,dotOn);
}
/* 练习时把字库的标准笔画隐形，格子里只留她自己写的 */
function setModelVisible(v){
  if(!writer) return;
  try{ writer.updateColor("strokeColor",
        v ? (getComputedStyle(document.body).getPropertyValue("--ink").trim()||"#1B2530")
          : "rgba(0,0,0,0)", {duration:0}); }catch(e){}
}
function buildGrid(){
  gsize=gridSize();
  const w=$("#gridwrap");
  w.style.width=w.style.height=gsize+"px";
  w.innerHTML='<svg class="deco" viewBox="0 0 1024 1024" aria-hidden="true">'+gridOf(cur)+'</svg>'+
              '<div id="writer"></div>'+
              '<svg class="deco ovl" id="ovl" viewBox="0 0 1024 1024" aria-hidden="true"></svg>'+
              /* 字母数字的笔顺动画 / 写错提示画在这里（latin-play.js），不用引擎自带的，见 CLAUDE.md 坑 5 */
              '<svg class="deco ovl" id="lpl" viewBox="0 0 1024 1024" aria-hidden="true"></svg>';
  const css=n=>getComputedStyle(document.body).getPropertyValue(n).trim();
  writer=HanziWriter.create($("#writer"),cur,{
    width:gsize,height:gsize,padding:0,
    strokeColor:css("--ink")||"#1B2530",
    outlineColor:css("--trace")||"#EBD2CE",
    drawingColor:css("--ink")||"#1B2530",
    drawingWidth:Math.round(gsize/15),
    strokeAnimationSpeed:.85, delayBetweenStrokes:420,
    showCharacter:false, showOutline:true,
    charDataLoader:(c,done)=>{ const g=glyph(c); done(g?{strokes:g.s,medians:g.m}:null) }
  });
}
/* ───────── 陪伴小猫 ─────────
   设计约定（和用户定过，别自作主张改）：
   · 只陪着，不评分——写得好写得差它的反应一模一样；
   · 只在【写完一整个字】时开心一次（冒爱心 + 叫一声），别的时候安静；
   · 它是装饰，pointer-events:none，永远不能挡住写字或按钮。
   猫画在 pet/ 之外的 app/cat.js（部署要带上它和 meow.wav）。 */
let pet=null;
function placePet(){
  const box=$("#petbox"), stage=$(".stage"); if(!box||!stage) return;
  /* 米字格居中，两边各剩这么多。够宽就蹲在右边，不够就挪到标题行去。 */
  const room=(stage.clientWidth-gsize)/2;
  if(room>=54){
    const size=Math.round(Math.max(52,Math.min(88,room-12)));
    if(box.parentNode!==stage) stage.appendChild(box);
    box.className=""; box.style.left="calc(50% + "+(gsize/2+10)+"px)";
    box.style.width=box.style.height=size+"px";
  }else{
    if(box.parentNode!==$(".pr-head")) $(".pr-head").insertBefore(box,$("#btn-say"));
    box.className="inhead"; box.style.left="";
    box.style.width=box.style.height="44px";
  }
}
function petOn(){
  if(!window.Cat) return;                       /* cat.js 没加载就当没这回事 */
  if(!pet) pet=Cat.attach($("#petbox"),{mood:"calm"});
  placePet();
}
function petOff(){ if(pet){ pet.destroy(); pet=null; } }
function petHappy(){ if(pet) pet.happy(1); }          /* 写完整个字：蹦 + 7 颗爱心 + 猫叫 */
function petPraise(){ if(pet) pet.praise(); }         /* 写好一格：歪头 + 2 颗爱心，无声 */
/* 一格「写得好」的线。用 位置/大小/间架 三项的【平均】，不是 r.total：
   total 会被 mistakes>=4 扣一星，那是笔顺问题，不该连坐把爱心也扣掉。
   2.5 意味着至少两项满星（3+3+2=2.67 过，3+2+2=2.33 不过）。
   这条线是唯一的旋钮 —— 看孩子实际拿到的频率再调，改这一个数就行。 */
const PRAISE_AT=2.5;

function btn(label,cls,fn){
  const b=document.createElement("button"); b.className="btn "+(cls||"");
  b.textContent=label; b.onclick=fn; return b;
}
function setIn(sel){
  const c=$(sel); if(!c) return;
  c.innerHTML="";
  [].slice.call(arguments,1).forEach(b=>b&&c.appendChild(b));
}
/* 练习页和听写页各有自己的按钮区，不能共用 id */
function setControls(){ setIn.apply(null,["#controls"].concat([].slice.call(arguments))); }

function buildPlan(){
  plan=[];
  for(let i=0;i<nTrace;i++) plan.push("trace");
  for(let i=0;i<nWrite;i++) plan.push("write");
  cells=[]; cellIdx=0;
}
function renderRow(){
  const parts=['<div class="rc model"><svg viewBox="0 0 1024 1024" aria-hidden="true">'+gridOf(cur)+
    modelPaths("var(--ink)")+'</svg><span>范字</span></div>'];
  plan.forEach((kind,i)=>{
    const e=cells[i], now=(phase==="do"&&i===cellIdx);
    const g = e ? inkPaths(e.ink,"var(--ink)")
                : (kind==="trace" ? modelPaths("var(--trace)") : "");
    parts.push('<div class="rc'+(now?" now":"")+'">'+
      '<svg viewBox="0 0 1024 1024" aria-hidden="true">'+gridOf(cur)+g+'</svg>'+
      '<span>'+(e?"★".repeat(e.stars):(kind==="trace"?"描":"写"))+'</span></div>');
  });
  $("#rowstrip").innerHTML=
    '<div class="rc-h"><span>描红 '+nTrace+' 格　·　默写 '+nWrite+' 格</span>'+
    '<button id="rc-n">改格数</button></div><div class="rc-row">'+parts.join("")+'</div>';
  const b=$("#rc-n");
  if(b) b.onclick=()=>{ nTrace=nWrite=(nTrace===3?5:3);
                        buildPlan(); goWatch(); beep("tap"); };
}
function openChar(ch,list){
  if(!has(ch) && !isLatin(ch)) return;
  if(!glyph(ch)) return ensureChars([ch],function(){ if(D[ch]) openChar(ch,list) });
  const g=glyph(ch), lat=isLatin(ch);
  cur=ch; curList=list&&list.length?list:[ch]; curIdx=Math.max(0,curList.indexOf(ch));
  show("#view-practice"); $("#title").textContent="练 “"+ch+"”";
  $("#pr-char").textContent=ch; $("#pr-char").classList.toggle("latin",lat);
  $("#pr-py").textContent= !lat ? g.p : isDigit(ch) ? "数字" : (/[a-z]/.test(ch)?"小写字母":"大写字母");
  $("#pr-sub").textContent="共 "+g.n+(lat?" 笔":" 画")+"　·　第 "+(curIdx+1)+"/"+curList.length+" 个";
  $("#strip").innerHTML=g.s.map((_,i)=>
    '<div class="strip-cell">'+charSVG(ch,i,{hi:true,fill:"var(--ink-3)",grid:gridOf(ch)})+
    '<span>'+(i+1)+'</span></div>').join("");
  markBtn();
  buildPlan(); buildGrid(); petOn(); goWatch(); speak(ch);
}
/* 播放笔顺。字母数字不用引擎的 animateCharacter：她的 b/q/a/d 是一笔里圆和竖贴在一起，
   引擎那条 200 宽的粗线写竖时会让圆提前冒出来（CLAUDE.md 坑 5），改用 latin-play.js 沿中心线画 */
function playStrokes(){
  if(!writer) return;
  const lp=$("#lpl");
  if(!isLatin(cur) || !window.LatinPlay || !lp){ writer.animateCharacter(); return; }
  writer.hideCharacter({duration:0});
  const ink0=getComputedStyle(document.body).getPropertyValue("--ink").trim()||"#1B2530";
  LatinPlay.play(lp,cur,{ink:ink0}).then(function(done){
    if(!done||phase!=="watch") return;
    LatinPlay.clear(lp); writer.showCharacter({duration:0});
  });
}
function clearLatinLayer(){ const lp=$("#lpl"); if(lp&&window.LatinPlay) LatinPlay.clear(lp); }
function goWatch(){
  phase="watch"; awaiting=false; ink=[]; mistakes=0;
  $("#scorebox").innerHTML="";
  if(writer){ writer.cancelQuiz(); setModelVisible(true);
              writer.showOutline(); playStrokes(); }
  paintOverlay(null,false); renderRow();
  $("#hintbar").innerHTML="看清楚<b>每一笔从哪里起笔</b>，再往下走。";
  setControls(btn("再看一遍","quiet",playStrokes),
              btn("开始描红 →","",()=>runCell(0)));
}
function runCell(i){
  if(i>=plan.length) return finishAll();
  phase="do"; awaiting=false; cellIdx=i; ink=[]; mistakes=0;
  const trace=(plan[i]==="trace");
  $("#scorebox").innerHTML="";
  writer.cancelQuiz(); clearLatinLayer(); setModelVisible(false);
  if(trace) writer.showOutline(); else writer.hideOutline();
  $("#hintbar").innerHTML= trace
    ? "第 <b>"+(i+1)+"</b> 格 · 描红　顺着浅色的字描"
    : "第 <b>"+(i+1)+"</b> 格 · 默写　"+(isLatin(cur)
        ? "<b>坐在红线上，高矮对准格线</b>"
        : "<b>写在正中间、填满格子</b>");
  renderRow();
  /* 起笔提示只在这个字的第一格念一次，后面每格都念太啰嗦 */
  startQuiz(trace, i===0, 0);
  cellControls();
}
/* from = 从第几笔开始（撤销后接着写）。注意 quiz() 是把选项【合并】进 writer 的
   持久配置，quizStartStrokeNum 传过一次就会粘住，所以每次都要显式传。
   ⚠️ 这里不再清空 ink / mistakes —— 撤销要保留前面的笔画，由 runCell 负责清。 */
function startQuiz(trace,cue,from){
  const start = from||0;
  const guide = trace || cfg.dot;
  writer.quiz({
    quizStartStrokeNum:start,
    showOutline:trace,
    /* 字母数字另乘各自的放宽系数（latin.js 的 k）：d/a/o 这类字母被引擎的形状比较吃亏，
       同样的偏差 b 能过 d 过不了，见 CLAUDE.md 坑 6 */
    leniency:(cfg.easy?1.5:1.0)*(trace?1.25:1)*(isLatin(cur)?(LATIN[cur].k||1):1),
    /* 写错几次后的示范：字母数字用 latin-play.js 自己画（引擎的会冒出多余部分，坑 5） */
    showHintAfterMisses:isLatin(cur)?false:(trace?1:3),
    highlightOnComplete:false,      /* 别闪标准字形 */
    onMistake:d=>{
      mistakes++; beep("bad");
      if(isLatin(cur) && window.LatinPlay && d.mistakesOnStroke>=(trace?1:3))
        LatinPlay.hint($("#lpl"),cur,d.strokeNum,{ink:getComputedStyle(document.body).getPropertyValue("--teal").trim()||"#12796F"});
      /* 一格里最多提醒两次起笔，再多就只留红点不出声——越急躁越帮倒忙 */
      if(d.mistakesOnStroke===1 && mistakes<=2){
        const st=strokeStart(d.strokeNum);
        if(st) say("这一笔从"+regionOf(st.a)+"起笔。",true);
      }
      paintOverlay(d.strokeNum,true);
    },
    onCorrectStroke:d=>{
      beep("tap");
      const pts=(d.drawnPath&&d.drawnPath.points)||[];
      /* drawnPath.points 是字形内部坐标(y 轴朝上)，与 medians 同一套 */
      ink.push(pts.map(q=>({x:q.x, y:900-q.y})));
      paintOverlay(d.strokesRemaining>0?d.strokeNum+1:null, guide);
      cellControls();               /* 写了笔才出现「这笔重写」 */
    },
    onComplete:()=>{ paintOverlay(null,false); cellDone(); }
  });
  paintOverlay(start,guide);
  const s0=strokeStart(start);
  if(guide&&cue&&s0) say((start?"接着写，":"第一笔，")+"从"+regionOf(s0.a)+"起笔。",true);
}
/* 上一笔写得不满意，退回去重写这一笔 */
function undoStroke(){
  if(!ink.length) return;
  ink.pop();
  writer.cancelQuiz();
  startQuiz(plan[cellIdx]==="trace", false, ink.length);
  cellControls(); beep("tap");
}
function cellControls(){
  setControls(
    ink.length ? btn("↶ 这笔重写","quiet",undoStroke) : null,
    btn("这格重写","quiet",()=>runCell(cellIdx)),
    btn("看笔顺","ghost",goWatch));
}

/* ── 评分：位置 / 大小 / 间架 ── */
function bbox(p){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const q of p){if(q.x<x0)x0=q.x;if(q.x>x1)x1=q.x;if(q.y<y0)y0=q.y;if(q.y>y1)y1=q.y;}
  return {x0,y0,x1,y1,w:x1-x0,h:y1-y0,cx:(x0+x1)/2,cy:(y0+y1)/2};
}
function centroid(p){let x=0,y=0;for(const q of p){x+=q.x;y+=q.y}return {x:x/p.length,y:y/p.length}}
/* 该怎么改——用小朋友听得懂的说法 */
function fixDir(dx,dy){
  const t=28,a=[];
  if(dy>t) a.push("高一点"); else if(dy<-t) a.push("低一点");
  if(dx>t) a.push("往左一点"); else if(dx<-t) a.push("往右一点");
  return a.join("、");
}
function dirName(dx,dy){
  const t=32,a=[];
  if(dx<-t)a.push("左"); else if(dx>t)a.push("右");   /* 中文说"左上""右下"，横向在前 */
  if(dy<-t)a.push("上"); else if(dy>t)a.push("下");
  return a.join("")||"中间";
}
function score(ch,user){
  const d=glyph(ch);
  const std=d.m.map(m=>m.map(p=>({x:p[0],y:900-p[1]}))).filter(m=>m.length);
  const uAll=[].concat.apply([],user.filter(s=>s.length));
  if(uAll.length<3||!std.length) return null;
  const sAll=[].concat.apply([],std);
  const ub=bbox(uAll), sb=bbox(sAll);
  const uM=Math.max(ub.w,ub.h,1), sM=Math.max(sb.w,sb.h,1);
  const dx=ub.cx-sb.cx, dy=ub.cy-sb.cy;
  const posMag=Math.hypot(dx,dy)/1024;
  const ratio=uM/sM;
  const k=sM/uM;
  const n=Math.min(std.length,user.length);
  let sum=0,cnt=0,worst=1,worstV=-1,wdx=0,wdy=0,wstart=null;
  for(let i=0;i<n;i++){
    if(!user[i]||!user[i].length) continue;
    const uc=centroid(user[i]), sc=centroid(std[i]);
    const nx=(uc.x-ub.cx)*k+sb.cx, ny=(uc.y-ub.cy)*k+sb.cy;
    const dd=Math.hypot(nx-sc.x,ny-sc.y);
    sum+=dd; cnt++;
    if(dd>worstV){ worstV=dd; worst=i+1; wdx=nx-sc.x; wdy=ny-sc.y; wstart=std[i][0]; }
  }
  const resid=cnt?sum/cnt/1024:0;
  const L=cfg.easy?1.35:1;
  const lr=Math.abs(Math.log(ratio));
  const pos = posMag<.055*L?3 : posMag<.11*L?2 : 1;
  const size= lr<.14*L?3 : lr<.30*L?2 : 1;
  const str = resid<.065*L?3 : resid<.12*L?2 : 1;
  let total=Math.round((pos+size+str)/3);
  if(mistakes>=4) total=Math.max(1,total-1);
  total=Math.max(1,Math.min(3,total));
  const dn=dirName(dx,dy), pct=Math.round(ratio*100);
  const fix=fixDir(dx,dy), wfix=fixDir(wdx,wdy), wreg=wstart?regionOf(wstart):"";
  return {pos,size,str,total,ub,sb,resid,ratio,worst,dn,fix,wfix,wreg,
    posMsg: pos===3 ? "正中间，很稳"
          : "整个字要"+(fix||"再对准一点")+"（现在偏"+dn+"）",
    sizeMsg: size===3 ? "大小刚刚好"
          : isLatin(ch)
            ? (ratio<1 ? ("写小了，只有该有的 "+pct+"%，高度要对准格线")
                       : ("写大了，撑到了 "+pct+"%，别超出格线"))
            : (ratio<1 ? ("写小了，只有该有的 "+pct+"%，笔画伸展开、填满格子")
                       : ("写大了，撑到了 "+pct+"%，往里收一收")),
    strMsg: str===3 ? "每一笔都落在该在的位置"
          : ("第 "+worst+" 笔要"+(wfix||"再准一点")+"；这一笔从"+wreg+"起笔"),
    ordMsg: mistakes===0?"一次就写对了" : ("笔顺提示了 "+mistakes+" 次")};
}
function drawOverlay(r){
  const rect=(bb,c,dash)=>'<rect x="'+bb.x0+'" y="'+bb.y0+'" width="'+Math.max(bb.w,4)+
    '" height="'+Math.max(bb.h,4)+'" fill="none" stroke="'+c+'" stroke-width="6"'+
    (dash?' stroke-dasharray="20 14"':'')+'/>';
  /* 她的笔迹保持原来的粗细，两个框画在上面 */
  $("#ovl").innerHTML = inkPaths(ink,"var(--ink)") +
    rect(r.sb,"var(--teal)",true) + rect(r.ub,"var(--amber)",false);
}
function starStr(n){return "★".repeat(n)+"☆".repeat(3-n)}
function advice(r){
  const w=[["pos",r.pos],["size",r.size],["str",r.str],
           ["ord",mistakes===0?3:mistakes<=2?2:1]].sort((a,b)=>a[1]-b[1])[0];
  if(w[1]>=3) return "每一笔都落在该在的位置，保持住。";
  const lat=isLatin(cur);
  const fix = w[0]==="pos" ? (lat ? ("要"+(r.fix||"再对准一点")+"，记得坐在红色的基线上。")
                                  : ("这个字要"+(r.fix||"再对准一点")+"，落笔前先看准中心点。"))
            : w[0]==="size" ? (lat
                ? (r.ratio<1 ? "写小了。矮的写到中线，高的碰到顶线。" : "写大了，别超出格线。")
                : (r.ratio<1 ? "字写小了。笔画伸展开，把格子填满。"
                             : "字写大了，撑出格子了，往里收一收。"))
            : w[0]==="str"  ? ("第 "+r.worst+" 笔要"+(r.wfix||"再准一点")+"，这一笔应该从"+r.wreg+"起笔。")
            : "笔顺记错了。我们回去把笔顺动画再看一遍。";
  return r.total>=3 ? "再注意一点会更棒："+fix : fix;
}
function nextBtn(){
  const i=cellIdx;
  if(i<plan.length-1){
    const k=plan[i+1]==="trace"?"描红":"默写";
    return btn("下一格 · "+k+" →","",()=>runCell(i+1));
  }
  return btn("看这一行的结果 →","",finishAll);
}
function cellDone(){
  awaiting=true;
  const trace=(plan[cellIdx]==="trace");
  const snap=ink.map(a=>a.slice());
  if(trace){
    /* 描红只看笔顺对不对——位置和大小是底字给的，评了没意义 */
    const st = mistakes===0?3 : mistakes<=2?2 : 1;
    cells[cellIdx]={kind:"trace", ink:snap, stars:st, mistakes:mistakes};
    beep(st===3?"good":"tap"); renderRow();
    const msg = mistakes===0 ? "笔顺全对，描得很好。" : "笔顺提示了 "+mistakes+" 次，再描一格试试。";
    $("#hintbar").innerHTML=msg;
    setControls(btn("这格重描","quiet",()=>runCell(cellIdx)), nextBtn());
    return;
  }
  const r=score(cur,ink);
  if(!r){ $("#hintbar").textContent="没记录到笔迹，再写一次试试。";
          setControls(btn("再写一遍","",()=>runCell(cellIdx))); return; }
  beep(r.total===3?"good":"tap");
  drawOverlay(r);
  cells[cellIdx]={kind:"write", ink:snap, stars:r.total, mistakes:mistakes,
                  pos:r.pos, size:r.size, str:r.str};
  renderRow();
  if(r.total>starsOf(cur)){stars[cur]=r.total;save(K.stars,stars);refreshStars()}
  const head=r.total===3?"写得真好！":r.total===2?"不错，还能更好。":"再练一次会更好。";
  const adv=advice(r), line=head+"　"+adv;
  $("#hintbar").innerHTML='<span class="legend"><span><i class="lg-t"></i>应该占的位置</span>'+
    '<span><i class="lg-u"></i>你写的位置</span></span>';
  $("#scorebox").innerHTML=
    '<div class="score"><div class="score-top"><span class="score-stars" style="color:var(--amber)">'+
    starStr(r.total)+'</span><h3>'+head+'</h3></div>'+
    '<div class="advice"><span>'+adv+'</span><button id="replay" aria-label="再说一遍">🔊</button></div>'+
    [["位置",r.posMsg,r.pos],["大小",r.sizeMsg,r.size],["间架",r.strMsg,r.str],
     ["笔顺",r.ordMsg,mistakes===0?3:mistakes<=2?2:1]]
      .map(([k,v,st])=>'<div class="metric"><span class="metric-k">'+k+'</span>'+
        '<span class="metric-v">'+v+'</span><span class="metric-s" style="color:var(--amber)">'+
        starStr(st)+'</span></div>').join("")+'</div>';
  if((r.pos+r.size+r.str)/3>=PRAISE_AT) petPraise();
  /* 格与格之间【完全不出声】—— 孩子反馈「不错，继续」这类也太频繁了（2026-09-17）。
     评价只在整个字写完时说一次（finishAll）。这里的内容照常显示在屏幕上给家长看，
     想听单格点评就点分卡上的 🔊。 */
  const rp=$("#replay"); if(rp) rp.onclick=()=>say(line,true);
  setControls(btn("这格重写","quiet",()=>runCell(cellIdx)), nextBtn());
  /* 不在这里自动滚到评分卡：一行还没写完，滚下去她得再往上划才能接着写（2026-09-29 用户反馈）。
     整行写完（finishAll）才滚到总评，那时已经不写了 */
}
function finishAll(){
  phase="done"; awaiting=true;
  if(writer){ writer.cancelQuiz(); }
  paintOverlay(null,false); renderRow();
  const ws=cells.filter(c=>c&&c.kind==="write");
  if(!ws.length){ goWatch(); return; }
  const n=ws.length, avg=ws.reduce((a,e)=>a+e.stars,0)/n;
  const dims=[["位置","pos","落笔前先找准中心点"],["大小","size","把笔画伸展开，填满格子"],
              ["间架","str","对着笔顺表，看每一笔该从哪起"]]
    .map(d=>[d[0], ws.reduce((a,e)=>a+e[d[1]],0)/n, d[2]]).sort((a,b)=>a[1]-b[1]);
  let trend="";
  if(n>=4){
    const h=Math.ceil(n/2);
    const f=ws.slice(0,h).reduce((a,e)=>a+e.stars,0)/h;
    const l=ws.slice(h).reduce((a,e)=>a+e.stars,0)/(n-h);
    trend = l-f>=.4 ? "越写越好，后面几格明显稳了。"
          : f-l>=.4 ? "后面几格有点松，可能写累了，休息一下再练。" : "这一行发挥很稳定。";
  }
  const w=dims[0];
  const line = avg>=2.6
    ? ("默写了 "+n+" 格，平均 "+avg.toFixed(1)+" 颗星。"+trend+"写得很好，保持住。")
    : ("默写了 "+n+" 格，平均 "+avg.toFixed(1)+" 颗星。"+trend+"最需要改的是"+w[0]+"，"+w[2]+"。");
  $("#hintbar").innerHTML="";
  $("#scorebox").innerHTML='<div class="score"><div class="score-top">'+
    '<span class="score-stars" style="color:var(--amber)">'+starStr(Math.round(avg))+'</span>'+
    '<h3>“'+cur+'” 写完一行</h3></div>'+
    '<div class="advice"><span>'+line+'</span><button id="replay2" aria-label="再说一遍">🔊</button></div>'+
    dims.map(d=>'<div class="metric"><span class="metric-k">'+d[0]+'</span>'+
      '<span class="metric-v">'+n+' 格平均 '+d[1].toFixed(1)+' 星</span>'+
      '<span class="metric-s" style="color:var(--amber)">'+starStr(Math.round(d[1]))+
      '</span></div>').join("")+'</div>';
  say(line,true);
  petHappy();   /* 写完一整个字 —— 不看几颗星，写完就为她高兴一下 */
  markDay();
  const plg=load(K.plog,{}), pe=plg[cur]||{n:0};
  plg[cur]={n:(pe.n||0)+1, t:todayStr()}; save(K.plog,plg);
  const rp=$("#replay2"); if(rp) rp.onclick=()=>say(line,true);
  const nx = curIdx<curList.length-1
    ? btn("下一个字 「"+curList[curIdx+1]+"」 →","",()=>openChar(curList[curIdx+1],curList)) : null;
  setControls(btn("再写一行","",()=>{buildPlan();goWatch()}), nx,
              nx?null:(fromTask ? btn("回到今天 →","",()=>goHome("today"))
                                : btn("回目录","ghost",goHome)));
  $("#scorebox").scrollIntoView({behavior:"smooth",block:"nearest"});
}

/* ── 打印字帖：每个字 = 笔顺分解行 + 练习行 ── */
const P_GRID='<rect x="4" y="4" width="1016" height="1016" fill="#fff" stroke="#C8463C" stroke-width="6"/>'+
  '<g stroke="#E8A9A3" stroke-width="4" stroke-dasharray="26 20">'+
  '<line x1="512" y1="4" x2="512" y2="1020"/><line x1="4" y1="512" x2="1020" y2="512"/>'+
  '<line x1="4" y1="4" x2="1020" y2="1020"/><line x1="1020" y1="4" x2="4" y2="1020"/></g>';
function pSvg(u,inner){
  return '<svg viewBox="0 0 1024 1024" style="width:'+u+';height:'+u+';flex:none">'+P_GRID+inner+'</svg>';
}
function pModel(ch,fill){
  return '<g transform="'+XF+'" fill="'+fill+'">'+
    D[ch].s.map(d=>'<path d="'+d+'"/>').join("")+'</g>';
}
/* 笔顺分解：画到第 i 笔，这一笔用红色，起笔处点一个红点 */
function pOrder(ch,i){
  const d=D[ch];
  let g='<g transform="'+XF+'">';
  for(let k=0;k<=i;k++)
    g+='<path d="'+d.s[k]+'" fill="'+(k===i?"#C8463C":"#C6CCD0")+'"/>';
  g+='</g>';
  const m=d.m[i];
  if(m&&m.length) g+='<circle cx="'+m[0][0]+'" cy="'+(900-m[0][1])+'" r="74" fill="#1B2530"/>';
  return g;
}
function pBlock(ch,U,UO){
  const d=D[ch];
  const ord=d.s.map((_,i)=>
    '<div class="p-oc">'+pSvg(UO,pOrder(ch,i))+'<span>'+(i+1)+'</span></div>').join("");
  const kinds=["model","trace","trace","none","none"];
  const row=kinds.map(k=>pSvg(U, k==="model"?pModel(ch,"#1B2530")
                              : k==="trace"?pModel(ch,"#E3CFCC") : "")).join("");
  return '<div class="p-ch"><div class="p-ch-h"><b>'+ch+'</b>　'+d.p+'　共 '+d.n+' 画'+
    '　<i>黑点＝这一笔从哪里起笔</i></div>'+
    '<div class="p-ord">'+ord+'</div><div class="p-row">'+row+'</div></div>';
}
function pPages(chars,title,U,UO,per){
  let out="";
  for(let i=0;i<chars.length;i+=per){
    out+='<div class="p-page"><div class="p-title"><span>'+title+
      '　（'+(Math.floor(i/per)+1)+'/'+Math.ceil(chars.length/per)+'）</span>'+
      '<span>姓名 __________　日期 __________</span></div>'+
      chars.slice(i,i+per).map(c=>pBlock(c,U,UO)).join("")+'</div>';
  }
  return out;
}
function openPrint(chars,title){
  if(!chars.length) return;
  if(chars.some(function(c){return !D[c]}))
    return ensureChars(chars,function(){ openPrint(chars,title) });
  const per=4, pages=Math.ceil(chars.length/per);
  $("#title").textContent="打印字帖";
  $("#view-print").innerHTML=
    '<div class="panel no-print" style="margin-top:16px"><h3 class="pt">'+title+'　·　'+
    chars.length+' 个字　·　'+pages+' 页</h3>'+
    '<p class="note">每个字两行：上面是<b>笔顺分解</b>（黑点标出每一笔从哪里起笔），'+
    '下面是<b>练习行</b>——1 格范字、2 格描红、2 格自己写。米字格 35mm，适合 5 岁的手。</p>'+
    '<p class="note">点下面的按钮会打开系统打印窗口。没有打印机的话选「存储为 PDF」，'+
    '发到手机拿去打印店印，几毛钱一张。</p>'+
    (chars.length>60?'<p class="miss">选了 '+chars.length+' 个字，'+pages+
      ' 页，下面的预览可能要等几秒才画完。</p>':'')+
    '<div class="row"><button class="btn" id="do-print">打印 / 存为 PDF</button>'+
    '<button class="btn ghost" id="print-back">返回</button></div></div>'+
    '<h2 class="theme-h no-print">预览　<small style="font-weight:600;color:var(--ink-3)">'+
    '下面就是打印出来的样子，全部 '+pages+' 页（可以横向滑动）</small></h2>'+
    '<div class="p-scroll"><div id="printable"></div></div>';
  show("#view-print");
  $("#printable").innerHTML=pPages(chars,title,"35mm","17mm",per);
  $("#do-print").onclick=()=>window.print();
  $("#print-back").onclick=()=>goHome();
}

/* ── 听写：先测，再练 ── */
const WORDS = window.WORDS || {};
let dList=[], dIdx=0, dItems=[], dInk=[], dDraw=null, dSize=340;
let dSrc=[], dShuffle=false;
function shuffled(a){
  const x=a.slice();
  for(let i=x.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1));
    const t=x[i]; x[i]=x[j]; x[j]=t; }
  return x;
}

function dictWords(ch){
  const w=WORDS[ch];
  return !w ? [] : (typeof w==="string" ? [w] : w);
}
function dSpeak(ch){
  if(!window.speechSynthesis) return;          /* 听写就是靠听，不受「朗读」开关影响 */
  try{ speechSynthesis.cancel(); }catch(e){}
  try{
    speechSynthesis.speak(utter(ch,.66));
    /* 一个词有时还对不上，两个词基本就懂了：地，大地的地，土地的地 */
    dictWords(ch).forEach(function(w){
      speechSynthesis.speak(utter(w+"的"+ch,.82));
    });
  }catch(e){}
}
function dictSize(){
  const w=Math.min($(".app").clientWidth-32,430);
  return Math.round(Math.max(230,Math.min(w, window.innerHeight-330, 430)));
}
function dPaint(){
  const el=$("#dink"); if(!el) return;
  el.innerHTML=inkPaths(dDraw?dInk.concat([dDraw]):dInk, "var(--ink)");
}
function dBind(){
  const g=$("#dgrid"), el=$("#dcatch");
  if(!g||!el) return;
  const pt=function(e){
    const r=g.getBoundingClientRect();
    return {x:(e.clientX-r.left)*1024/r.width, y:(e.clientY-r.top)*1024/r.height};
  };
  el.onpointerdown=function(e){
    e.preventDefault();
    try{ el.setPointerCapture(e.pointerId); }catch(x){}
    dDraw=[pt(e)]; dPaint();
  };
  el.onpointermove=function(e){
    if(!dDraw) return;
    const q=pt(e), last=dDraw[dDraw.length-1];
    if(Math.hypot(q.x-last.x,q.y-last.y)>6){ dDraw.push(q); dPaint(); }
  };
  el.onpointerup=el.onpointercancel=el.onpointerleave=function(){
    if(!dDraw) return;
    dInk.push(dDraw); dDraw=null; dPaint(); dCtl();
  };
}
function dCtl(){
  const has=dInk.length>0, i=dIdx;
  const done=btn(has?"写好了 →":"写好了 →","",function(){ dNext(false) });
  if(!has) done.disabled=true;
  setIn("#dctl",
    has?btn("撤销一笔","quiet",function(){ dInk.pop(); dPaint(); dCtl(); }):null,
    has?btn("清空","quiet",function(){ dInk=[]; dPaint(); dCtl(); }):null,
    btn("不会，跳过","ghost",function(){ dNext(true) }),
    done);
}
/* shuffle=true：听写打乱顺序，免得她靠"第几个"猜；打印字帖仍按课本顺序 */
function openDict(chars,shuffle){
  if(!chars||!chars.length) return;
  if(chars.some(function(c){return !D[c]}))
    return ensureChars(chars,function(){ openDict(chars,shuffle) });
  dSrc=chars.slice(); dShuffle=!!shuffle; dRecorded=false;
  dList=shuffle?shuffled(chars):chars.slice(); dIdx=0;
  dItems=dList.map(function(c){ return {ch:c, ink:[], skipped:false, ok:null}; });
  show("#view-dict"); dRound();
}
function dRound(){
  dInk=[]; dDraw=null; dSize=dictSize();
  const it=dItems[dIdx], ch=it.ch;
  $("#title").textContent="听写 "+(dIdx+1)+"/"+dItems.length;
  $("#view-dict").innerHTML=
    '<div class="dict-h"><span>第 <b>'+(dIdx+1)+'</b> / '+dItems.length+' 个</span>'+
    '<button class="linkbtn" id="d-say">🔊 再念一遍</button></div>'+
    '<div class="dict-py">'+D[ch].p+'</div>'+
    '<div class="stage"><div class="gridwrap" id="dgrid" style="width:'+dSize+'px;height:'+dSize+'px">'+
      '<svg class="deco" viewBox="0 0 1024 1024" aria-hidden="true">'+MZG+'</svg>'+
      '<svg class="deco" id="dink" viewBox="0 0 1024 1024" aria-hidden="true"></svg>'+
      '<div class="dcatch" id="dcatch"></div></div></div>'+
    '<div class="hintbar">听清楚了再写。<b>没有提示、没有笔顺</b>——这是考试，不是练习。</div>'+
    '<div class="controls" id="dctl"></div>';
  dBind(); dPaint(); dCtl();
  $("#d-say").onclick=function(){ dSpeak(ch) };
  setTimeout(function(){ dSpeak(ch) },250);
}
function dNext(skipped){
  const it=dItems[dIdx];
  it.ink=dInk.map(function(a){return a.slice()});
  it.skipped=!!skipped;
  it.ok = skipped ? false : true;     /* 默认算写对，家长只需要挑出错的 */
  dIdx++;
  if(dIdx>=dItems.length) dReview(); else dRound();
}
/* 自动提示：只用笔画数和外框，不需要笔画一一对应，所以自由书写也算得准 */
function dHints(it){
  if(it.skipped||!it.ink.length) return "空着没写";
  const a=[], want=D[it.ch].n, n=it.ink.length;
  a.push("写了 "+n+" 笔"+(n===want?"（笔数对）":"（这个字 "+want+" 笔）"));
  const pts=[].concat.apply([], it.ink);
  const ub=bbox(pts), b=D[it.ch].b;
  const sw=Math.max(b[2]-b[0],1), sh=Math.max(b[3]-b[1],1);
  const dx=ub.cx-(b[0]+b[2])/2, dy=ub.cy-(b[1]+b[3])/2;
  if(Math.hypot(dx,dy)>95) a.push("整体偏"+dirName(dx,dy));
  const r=Math.max(ub.w,ub.h)/Math.max(sw,sh);
  if(r<.72) a.push("写小了"); else if(r>1.32) a.push("写大了");
  return a.join("　·　");
}
function dReview(){
  $("#title").textContent="批改";
  const rows=dItems.map(function(it,i){
    return '<div class="jrow" data-i="'+i+'"><div class="jpair">'+
      '<div class="jc"><svg viewBox="0 0 1024 1024" aria-hidden="true">'+MZG+
        (it.ink.length?inkPaths(it.ink,"var(--ink)"):"")+'</svg><span>她写的</span></div>'+
      '<div class="jc"><svg viewBox="0 0 1024 1024" aria-hidden="true">'+MZG+
        '<g transform="'+XF+'" fill="var(--ink-3)">'+
        D[it.ch].s.map(function(d){return '<path d="'+d+'"/>'}).join("")+
        '</g></svg><span>标准</span></div></div>'+
      '<div class="jinfo"><div class="jch">'+it.ch+' <small>'+D[it.ch].p+
        (dictWords(it.ch).length?('　'+dictWords(it.ch).join('／')):'')+'</small></div>'+
      '<div class="note" style="margin:5px 0 0">'+dHints(it)+'</div>'+
      '<div class="jbtns"><button class="jb ok'+(it.ok===true?" on":"")+'" data-j="1">✓ 写对了</button>'+
      '<button class="jb no'+(it.ok===false?" on":"")+'" data-j="0">✗ 没写对</button>'+
      '</div></div></div>';
  }).join("");
  $("#view-dict").innerHTML=
    '<h2 class="theme-h" style="margin-top:16px">批改 · 共 '+dItems.length+' 个</h2>'+
    '<p class="note">默认都算写对了，<b>只要把没写对的点出来</b>就行。空着跳过的已经标成没写对。<br>'+
    '左右两个格子对比着看最快：形近字（天/大、木/本、土/士）只有人眼分得出来。</p>'+
    rows+'<div class="controls" id="dctl"></div>';
  $("#view-dict").onclick=function(e){
    const b=e.target.closest(".jb"); if(!b) return;
    const row=b.closest(".jrow"), i=+row.dataset.i;
    dItems[i].ok = b.dataset.j==="1";
    row.querySelectorAll(".jb").forEach(function(x){ x.classList.remove("on") });
    b.classList.add("on"); beep("tap");
  };
  setIn("#dctl", btn("看结果 →","",dResult));
  window.scrollTo(0,0);
}
let dRecorded=false;
function dResult(){
  const bad=dItems.filter(function(it){return it.ok===false}).map(function(it){return it.ch});
  if(!dRecorded){                    /* 家长判完才入库，且一轮只记一次 */
    bad.forEach(wrongAdd);
    save(K.wrong,wrong);
    dRecorded=true;
    markDay();
    if(fromTask==="zh-dict"){ const r=todayRec(); r.done=r.done||{}; r.done["zh-dict"]=1; r.v=1; saveTodayRec(r); }
  }
  const wrongArr=bad, n=dItems.length, ok=n-wrongArr.length;
  $("#title").textContent="听写结果";
  const line = wrongArr.length
    ? ("写对 "+ok+" 个，有 "+wrongArr.length+" 个还不会：" + wrongArr.join("、") + "。我们来练一练。")
    : ("全对！"+n+" 个字都写对了。");
  $("#view-dict").innerHTML=
    '<div class="score" style="margin-top:16px"><div class="score-top">'+
    '<span class="score-stars" style="color:var(--amber)">'+(wrongArr.length?"":"★★★")+'</span>'+
    '<h3>写对 '+ok+' / '+n+'</h3></div>'+
    '<div class="advice"><span>'+line+'</span>'+
    '<button id="d-replay" aria-label="再说一遍">🔊</button></div>'+
    (wrongArr.length? '<div class="chips" style="margin-top:6px">'+
      wrongArr.map(function(c){return '<button class="chip" data-ch="'+c+'"><span class="g">'+c+
        '</span></button>'}).join("")+'</div>' : '')+
    '</div><div class="controls" id="dctl"></div>';
  say(line,true);
  const rp=$("#d-replay"); if(rp) rp.onclick=function(){ say(line,true) };
  setIn("#dctl",
    wrongArr.length? btn("开始练这 "+wrongArr.length+" 个字 →","",function(){ openChar(wrongArr[0],wrongArr) }) : null,
    btn("再听写一遍","quiet",function(){ openDict(dSrc,dShuffle) }),
    fromTask ? btn("回到今天 →","ghost",()=>goHome("today")) : btn("回目录","ghost",goHome));
  $("#view-dict").onclick=function(e){
    const c=e.target.closest("[data-ch]");
    if(c) openChar(c.dataset.ch, wrongArr.length?wrongArr:dList);
  };
  window.scrollTo(0,0);
}

/* ── 导航 / 设置 ── */
/* ── 认字小游戏 ──────────────────────────────────────────
   一天 3 局。这是**限量**不是**门票** —— 和写不写字无关。
   千万别做成"写完字才能玩"：那样写字就变成了代价、游戏变成了报酬，
   孩子学到的是"写字是讨厌的部分"。限量的意义在别处：只有几次机会，
   她才会认真对待每一次，而不是乱点刷过去。 */
const GAME_PER_DAY=3;
/* 本地日期。以前用 toISOString（UTC），北京时间早上 8 点前会算成前一天，
   游戏的「一天 3 局」要到早上 8 点才重置 */
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0") }
function gameLeft(){ return window.MatchGame
  ? MatchGame.leftToday(load(K.gday,null), GAME_PER_DAY, todayStr()) : 0 }
/** 她学过的字 = 第 1 课到「当前课次」的全部生字 */
function learnedChars(){
  const upto=Math.min(cfg.lesson|0, TEXTBOOK.length-1), out=[];
  for(let i=0;i<=upto;i++) if(TEXTBOOK[i]) out.push.apply(out, TEXTBOOK[i].chars);
  return out;
}
/* 听音选词：和认字游戏同一套规矩，各自一天 3 局 */
function listenLeft(){ return window.MatchGame
  ? MatchGame.leftToday(load(K.lgday,null), GAME_PER_DAY, todayStr()) : 0 }
function openListen(){
  if(!window.ListenGame || !window.EN_WORDS || listenLeft()<=0) return;
  if(gameCtl&&gameCtl.destroy) gameCtl.destroy();
  show("#view-game"); $("#title").textContent="听音选词";
  beep("tap");
  const st=load(K.lgstat,{});
  gameCtl=ListenGame.attach($("#view-game"),{
    words:function(){ return EN_WORDS.ALL.slice() },
    html:function(x){ return EN_WORDS.svg(x,{h:46}) },
    pic:function(w){ return EN_WORDS.PIC[w]||"" },
    stats:function(){ return st },
    saveStat:function(w,ok,ms){
      const e=st[w]||{n:0,ok:0,rt:0,last:0};
      e.n++; if(ok){ e.ok++; e.rt+=ms }
      e.last=Date.now(); st[w]=e; save(K.lgstat,st);
    },
    best:function(){ return load(K.lgbest,0) },
    saveBest:function(ms){ save(K.lgbest,ms) },
    useRound:function(){
      markDay();
      const t=todayStr(), r=load(K.lgday,null);
      save(K.lgday,(r&&r.d===t)?{d:t,n:(r.n||0)+1}:{d:t,n:1});
    },
    speak:speakWord, say:say, beep:beep,
    cat:function(host){ return window.Cat?Cat.attach(host,{mood:"calm"}):null },
    onExit:function(){ goHome("today") }
  });
}
let gameCtl=null;
function openGame(){
  if(!window.MatchGame || gameLeft()<=0) return;
  if(gameCtl&&gameCtl.destroy) gameCtl.destroy();
  show("#view-game"); $("#title").textContent="认字";
  beep("tap");
  gameCtl=MatchGame.attach($("#view-game"),{
    learned:learnedChars,
    pinyinOf:function(ch){ return (D[ch]&&D[ch].p)||"" },
    stats:function(){ return gstat },
    saveStat:function(ch,ok,ms){
      const e=gstat[ch]||{n:0,ok:0,rt:0,last:0};
      e.n++; if(ok){ e.ok++; e.rt+=ms }   /* rt 只累计答对的，错的那次没有意义 */
      e.last=Date.now(); gstat[ch]=e; save(K.gstat,gstat);
    },
    best:function(){ return load(K.gbest,0) },
    saveBest:function(ms){ save(K.gbest,ms) },
    useRound:function(){
      markDay();
      const t=todayStr(), r=load(K.gday,null);
      save(K.gday,(r&&r.d===t)?{d:t,n:(r.n||0)+1}:{d:t,n:1});
    },
    speak:speak, say:say, beep:beep,
    cat:function(host){ return window.Cat?Cat.attach(host,{mood:"calm"}):null },
    onExit:function(){ goHome("today") }
  });
}

/* ── 英文单词拼写页（spell.js）：听 → 描红 → 默写 ──
   星星：默写没错 3 颗，错过但没看提示 2 颗，看了提示 1 颗（记最好的一次，和写字一样）。
   看了提示 = 这个词还不会拼，自动进「要多练的单词」——和听写写错自动进「要多练的字」同一个道理 */
let spellCtl=null;
function spellOff(){ if(spellCtl){ spellCtl.destroy(); spellCtl=null; } }
function speakWord(w){
  if(!cfg.speak||!window.speechSynthesis) return;
  try{ speechSynthesis.cancel(); speechSynthesis.speak(utterEn(w,.75)); }catch(e){}
}
function openWord(w,list){
  if(!window.Spell||!window.EN_WORDS||!EN_WORDS.W[w]) return;
  spellOff(); if(writer) writer.cancelQuiz(); petOff();
  list=list&&list.length?list:[w];
  const i=Math.max(0,list.indexOf(w)), nx=list[i+1], k=WK(w);
  show("#view-word"); $("#title").textContent="拼 “"+w+"”";
  spellCtl=Spell.attach($("#view-word"),{
    word:w, pos:"第 "+(i+1)+"/"+list.length+" 个",
    html:function(x,h){ return EN_WORDS.svg(x,{h:h||56}) }, colors:EN_WORDS.letterColors,
    pic:function(x){ return EN_WORDS.PIC[x]||"" },
    speak:speakWord, beep:beep,
    cat:function(host){ return window.Cat?Cat.attach(host,{mood:"calm"}):null },
    leniency:function(){ return cfg.easy?1.5:1.0 },
    marked:function(){ return !!wrong[k] },
    toggleMark:function(){
      if(wrong[k]){ delete wrong[k]; beep("tap"); } else { wrongAdd(k); beep("good"); }
      save(K.wrong,wrong);
    },
    onDone:function(r){
      const st=r.hints?1:(r.misses?2:3);
      if(st>starsOf(k)){ stars[k]=st; save(K.stars,stars); refreshStars(); }
      if(r.hints){ wrongAdd(k); save(K.wrong,wrong); }
      markDay();
      const plg=load(K.plog,{}), pe=plg[k]||{n:0};
      plg[k]={n:(pe.n||0)+1, t:todayStr()}; save(K.plog,plg);
    },
    next: nx ? {label:"下一个 「"+nx+"」 →", go:function(){ beep("tap"); openWord(nx,list); }}
         : fromTask ? {label:"回到今天 →", go:function(){ goHome("today"); }}
         : {label:"回目录", go:function(){ goHome(); }}
  });
}

/* 回到某一层：不传就回到当前科目页（小游戏退出时用）。
   先收拾当前页（停写字、收小猫、关游戏、停语音），再切过去；
   setSubj 里会重画——听写完「要多练的字」变了，不重画的话练习页还是旧的 */
function goHome(target){
  fromTask=null;
  if(writer)writer.cancelQuiz(); petOff(); spellOff();
  if(gameCtl&&gameCtl.destroy){gameCtl.destroy();gameCtl=null}
  if(window.speechSynthesis) try{speechSynthesis.cancel()}catch(e){}
  setSubj(typeof target==="string"?target:subj);
}
$("#btn-say").onclick=()=>speak(cur);
$("#btn-mark").onclick=markToggle;
const dlg=$("#dlg");
function openPlan(){
  if(!window.Today) return;
  /* 注意：计划页也要知道哪些科目上线了，否则会让家长排进还没做的音乐 */
  if(writer)writer.cancelQuiz(); petOff(); spellOff();
  show("#view-plan"); $("#title").textContent="每周计划";
  Today.renderPlan($("#view-plan"),{
    plan:function(){ return load(K.week,null) },
    savePlan:function(p){ save(K.week,p) },
    enabled:subjEnabled,
    beep:beep
  });
}
$("#btn-plan").onclick=function(){ dlg.close(); openPlan(); };
$("#btn-close").onclick=()=>dlg.close();
[["#sw-speak","speak"],["#sw-sound","sound"],["#sw-easy","easy"],
 ["#sw-voice","voice"],["#sw-dot","dot"]].forEach(([sel,key])=>{
  const el=$(sel);
  el.setAttribute("aria-pressed",String(!!cfg[key]));
  el.onclick=()=>{cfg[key]=!cfg[key];el.setAttribute("aria-pressed",String(cfg[key]));save(K.cfg,cfg);beep("tap")};
});
/* ── 备份 / 恢复 ── */
function bakPayload(){
  return JSON.stringify({v:1, t:new Date().toISOString().slice(0,10),
    stars:stars, sel:load(K.sel,[]), wrong:wrong, cfg:cfg,
    week:load(K.week,null), days:load(K.days,{}), plog:load(K.plog,{}),
    gstat:load(K.gstat,{}), gbest:load(K.gbest,0), lgstat:load(K.lgstat,{}), lgbest:load(K.lgbest,0)});
}
function bakWhen(){
  const el=$("#bak-when"); if(!el) return;
  const t=load("mzg.bakAt","");
  el.textContent = t ? ("上次备份 "+t) : "从未备份 —— 建议存一份";
  el.className = t ? "" : "bad";
}
/* Artifact 查看器把页面嵌在 iframe 里且禁止下载；部署到自己的网址后（顶层窗口）才可以。
   window.claude 在未声明 capability 的 artifact 里不一定存在，所以用 iframe 判据兜底。 */
let CAN_DOWNLOAD = true;
try{ CAN_DOWNLOAD = (window.self===window.top) && !window.claude; }catch(e){ CAN_DOWNLOAD=false; }
function openBak(){
  $("#bak-out").value=bakPayload();
  $("#bak-in").value=""; $("#bak-msg").textContent="";
  const fb=$("#bak-file");
  if(fb) fb.hidden=!CAN_DOWNLOAD;
  const hint=$("#bak-hint");
  if(hint) hint.textContent = CAN_DOWNLOAD ? "" : "（当前网址不支持下载文件，请用「复制」）";
  dlg.close(); $("#dlgbak").showModal();
}
function markBaked(){ save("mzg.bakAt", new Date().toISOString().slice(0,16).replace("T"," ")); bakWhen(); }
function fillVoiceSel(){
  const el=$("#sel-voice"); if(!el) return;
  const cur=cfg.voiceURI||"";
  el.innerHTML='<option value="">系统默认</option>'+VOICES.map(function(v){
    return '<option value="'+esc(v.voiceURI)+'">'+esc(v.name)+'</option>';
  }).join("");
  el.value = VOICES.some(function(v){return v.voiceURI===cur}) ? cur : "";
  const m=$("#voice-msg"); if(m) m.style.display="none";
  const tip=$("#voice-tip");
  if(tip) tip.innerHTML =
    '这台设备上有 <b>'+VOICES.length+'</b> 个中文声音。列表里只会出现<b>本机已经装了的</b>——'+
    '网页没法自己加音色，所以每台设备看到的都不一样。<br>'+
    '想要更自然的：<b>iPad 设置 → 辅助功能 → 朗读内容 → 声音 → 中文</b>（不同 iPadOS 版本'+
    '措辞略有出入），把带下载标记的音色下下来，尤其是标「增强」或「高级」的。'+
    '下完回到这里点<b>刷新</b>；还没出现就把这个页面关掉重开一次。';
}
$("#sel-voice").onchange=function(){ cfg.voiceURI=this.value; save(K.cfg,cfg); };
$("#btn-vrefresh").onclick=function(){
  const before=VOICES.length;
  loadVoices(); fillVoiceSel(); beep("tap");
  const m=$("#voice-msg"); if(!m) return;
  m.style.display="block";
  m.innerHTML = VOICES.length>before
    ? '<b class="ok">找到 '+(VOICES.length-before)+' 个新声音。</b>'
    : '还是 <b>'+before+'</b> 个，没找到新的。刚下载完的话，把页面<b>关掉重新打开</b>再看'+
      '（iOS 有时要重开才认新装的语音）。';
};
$("#sel-rate").onchange=function(){ cfg.rate=parseFloat(this.value)||1; save(K.cfg,cfg); };
$("#btn-try").onclick=function(){
  if(!window.speechSynthesis) return;
  try{ speechSynthesis.cancel();
       speechSynthesis.speak(utter("天",.66));
       speechSynthesis.speak(utter("今天的天",.82));
       speechSynthesis.speak(utter("天空的天",.82)); }catch(e){}
};
/* 「学到第几课」：认字游戏的字库上限。她往前学一课，这里往后调一格。 */
function fillLessonSel(){
  const el=$("#sel-lesson"); if(!el||!TEXTBOOK.length) return;
  el.innerHTML=TEXTBOOK.map(function(l,i){
    return '<option value="'+i+'">'+l.name+'</option>'}).join("");
  el.value=String(Math.min(cfg.lesson|0,TEXTBOOK.length-1));
}
$("#sel-lesson").onchange=function(){
  cfg.lesson=parseInt(this.value,10)||0; save(K.cfg,cfg);
  renderHome();   /* 可玩的字变了，入口卡的说明也跟着变 */
};
$("#btn-set").onclick=function(){ loadVoices(); fillVoiceSel(); fillLessonSel();
  const rs=$("#sel-rate");
  rs.value=String(cfg.rate||1);
  if(!rs.value){ rs.value="1"; cfg.rate=1; save(K.cfg,cfg); }  /* 存的档位没了就回正常 */
  dlg.showModal(); };
$("#build-n").textContent = /^__/.test(BUILD) ? "本地开发版" : BUILD;
$("#btn-update").onclick=function(){
  /* 加个时间戳强制绕过缓存，等于"硬刷新" */
  location.replace(location.pathname+"?v="+Date.now());
};
$("#btn-bak").onclick=openBak;
$("#bak-close").onclick=()=>$("#dlgbak").close();
$("#bak-copy").onclick=function(){
  const ta=$("#bak-out");
  ta.select(); ta.setSelectionRange(0,999999);
  const done=function(){ $("#bak-msg").textContent="已复制，去备忘录粘贴保存。";
                         $("#bak-msg").className="note ok"; markBaked(); beep("good"); };
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(ta.value).then(done,function(){
      $("#bak-msg").textContent="复制没成功——长按上面的文字，选「全选」再「拷贝」。";
      $("#bak-msg").className="note bad";
    });
  else { $("#bak-msg").textContent="已选中——长按选「拷贝」。"; $("#bak-msg").className="note"; markBaked(); }
};
$("#bak-file").onclick=function(){
  if(!CAN_DOWNLOAD){
    $("#bak-msg").textContent="当前网址不支持下载文件，请用「复制」。";
    $("#bak-msg").className="note bad"; return;
  }
  try{
    const b=new Blob([bakPayload()],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(b);
    a.download="练字记录-"+new Date().toISOString().slice(0,10)+".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),3000);
    $("#bak-msg").textContent="已存到「文件」App（看下载项）。如果没看到，请改用「复制」。";
    $("#bak-msg").className="note"; markBaked();
  }catch(e){
    $("#bak-msg").textContent="存文件失败，请改用「复制」。"; $("#bak-msg").className="note bad";
  }
};
$("#bak-do").onclick=function(){
  const raw=$("#bak-in").value.trim();
  const msg=$("#bak-msg");
  if(!raw){ msg.textContent="先把备份内容贴进上面的框。"; msg.className="note bad"; return; }
  let d;
  try{ d=JSON.parse(raw); }catch(e){ d=null; }
  if(!d||typeof d!=="object"||!("stars" in d||"sel" in d||"cfg" in d||"wrong" in d)){
    msg.textContent="这段内容看不懂——要贴的是备份里那一整段（以 { 开头、} 结尾）。";
    msg.className="note bad"; return;
  }
  if(d.stars&&typeof d.stars==="object"){ stars=d.stars; save(K.stars,stars); }
  if(Array.isArray(d.sel)){ save(K.sel,d.sel); }
  if(d.wrong&&typeof d.wrong==="object"){ wrong=d.wrong; save(K.wrong,wrong); }
  /* 2026-09-29 起备份里多了这几项；老备份没有就跳过 */
  if(d.week&&typeof d.week==="object") save(K.week,d.week);
  if(d.days&&typeof d.days==="object"&&!Array.isArray(d.days)) save(K.days,d.days);
  if(d.plog&&typeof d.plog==="object"&&!Array.isArray(d.plog)) save(K.plog,d.plog);
  if(d.gstat&&typeof d.gstat==="object"&&!Array.isArray(d.gstat)){ gstat=d.gstat; save(K.gstat,gstat); }
  if(typeof d.gbest==="number") save(K.gbest,d.gbest);
  if(d.lgstat&&typeof d.lgstat==="object"&&!Array.isArray(d.lgstat)) save(K.lgstat,d.lgstat);
  if(typeof d.lgbest==="number") save(K.lgbest,d.lgbest);
  if(d.cfg&&typeof d.cfg==="object"){
    cfg=Object.assign({speak:true,sound:true,easy:true,voice:true,dot:true,recOrder:"write"},d.cfg);
    save(K.cfg,cfg);
    [["#sw-speak","speak"],["#sw-sound","sound"],["#sw-easy","easy"],
     ["#sw-voice","voice"],["#sw-dot","dot"]].forEach(function(x){
       const el=$(x[0]); if(el) el.setAttribute("aria-pressed",String(!!cfg[x[1]]));
     });
  }
  refreshStars(); renderHome();
  $("#bak-out").value=bakPayload();   /* 恢复后把备份框也刷新，免得显示的是旧的 */
  msg.textContent="恢复好了"+(d.t?("（备份日期 "+d.t+"）"):"")+"。";
  msg.className="note ok"; beep("good");
};

if(window.speechSynthesis){
  loadVoices();
  try{ window.speechSynthesis.onvoiceschanged=function(){ loadVoices(); fillVoiceSel(); }; }catch(e){}
}

/* 请求持久化存储，减少 iOS 自动清理的概率 */
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}

$("#btn-reset").onclick=()=>{
  if(confirm("把所有星星清空？")){stars={};save(K.stars,stars);refreshStars();renderHome();}
};
let rt=null;
window.addEventListener("resize",()=>{
  clearTimeout(rt);
  rt=setTimeout(()=>{
    if(awaiting) return;              /* 正在看评分：转屏不重建，免得结果被冲掉 */
    if(!$("#view-practice").hidden&&Math.abs(gridSize()-gsize)>12){
      buildGrid(); placePet(); if(phase==="do") runCell(cellIdx); else goWatch();
    }},220);
});
$("#go-dict").onclick=function(){
  const list=selOrdered();
  if(list.length) openDict(list,true);      /* 听写打乱 */
};
$("#go-print").onclick=function(){
  const list=selOrdered();
  if(list.length) openPrint(list, "选中的字");
};
refreshStars(); renderHome(); bakWhen();
})();
</script>
